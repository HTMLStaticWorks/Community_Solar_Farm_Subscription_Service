<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscriber Login - Sunova</title>
    <meta name="description" content="Log in to your Sunova subscriber dashboard to view monthly energy credit allocations and bill savings.">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="auth-page d-flex align-items-center min-vh-100 py-4">
    <!-- Quick Top Controls (Theme & RTL) -->
    <div class="auth-controls">
        <button class="rtl-toggle" id="rtlToggle" title="Toggle RTL/LTR">
            <span class="rtl-text">RTL</span>
        </button>
        <button class="theme-toggle" id="themeToggle" title="Switch Theme">
            <i class="bi bi-moon-fill"></i>
        </button>
    </div>


    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-sm-5">
                        <div class="text-center mb-4">
                            <a href="index.html" class="d-inline-flex align-items-center justify-content-center gap-2 text-decoration-none mb-1">
                                <img src="assets/images/logo.svg" alt="Sunova" width="36" height="36">
                                <h3 class="fw-bold mb-0"><span class="text-primary">Sunova</span></h3>
                            </a>
                            <p class="text-muted small mt-1 mb-0">Subscriber Portal • Track Credits & Savings</p>
                        </div>
                        <form action="dashboard.html">
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="emailInput" placeholder="subscriber@example.com"
                                    value="subscriber@example.com" required>
                                <label for="emailInput">Subscriber Email</label>
                            </div>
                            <div class="form-floating mb-3 position-relative password-field-wrapper">
                                <input type="password" class="form-control pe-5" id="passwordInput" placeholder="Password"
                                    value="password123" required>
                                <label for="passwordInput">Password</label>
                                <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y password-toggle-btn" onclick="togglePasswordVisibility('passwordInput', this)" title="Show/Hide Password" aria-label="Toggle Password Visibility">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                                    <label class="form-check-label small" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="text-primary text-decoration-none small text-end text-nowrap ms-auto">Forgot Password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold">Sign In to Dashboard</button>
                        </form>
                        <div class="d-flex align-items-center my-3">
                            <hr class="flex-grow-1">
                            <span class="mx-2 text-muted small">OR</span>
                            <hr class="flex-grow-1">
                        </div>
                        <div class="d-flex flex-column gap-2 mb-3">
                            <button type="button" class="btn btn-outline-secondary w-100 fw-semibold py-2 d-flex align-items-center justify-content-center gap-2 social-btn">
                                <i class="bi bi-google text-danger"></i> Sign in with Google
                            </button>
                            <button type="button" class="btn btn-outline-secondary w-100 fw-semibold py-2 d-flex align-items-center justify-content-center gap-2 social-btn">
                                <i class="bi bi-apple fs-5"></i> Sign in with Apple
                            </button>
                        </div>
                        <div class="text-center mt-4">
                            <p class="mb-0 small">Not enrolled in a farm share yet? <a href="register.html"
                                    class="fw-bold text-primary text-decoration-none">Subscribe Now</a></p>
                        </div>
                        <div class="text-center mt-3">
                            <a href="index.html" class="text-muted text-decoration-none small"><i
                                    class="bi bi-arrow-left"></i> Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
