<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe to a Solar Farm - Sunova</title>
    <meta name="description" content="Subscribe to a local community solar farm with $0 upfront cost. Match your utility account and start receiving solar bill credits.">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-light d-flex align-items-center min-vh-100 py-4">
    <!-- Quick Top Controls (Theme & RTL) -->
    <div class="position-fixed top-0 end-0 p-3 d-flex gap-2" style="z-index: 1050;">
        <button class="rtl-toggle" id="rtlToggle" title="Toggle RTL/LTR">
            <span class="rtl-text">RTL</span>
        </button>
        <button class="theme-toggle" id="themeToggle" title="Switch Theme">
            <i class="bi bi-moon-fill"></i>
        </button>
    </div>


    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <a href="index.html" class="text-decoration-none">
                                <img src="assets/images/logo.svg" alt="Sunova" width="44" height="44" class="mb-2">
                                <h4 class="fw-bold mb-1"><span class="text-primary">Sunova</span></h4>
                            </a>
                            <p class="text-muted small">Reserve Your Local Farm Share • $0 Upfront Cost</p>
                        </div>
                        <form action="dashboard.html">
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="firstName" placeholder="First Name"
                                            required>
                                        <label for="firstName">First Name</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="lastName" placeholder="Last Name"
                                            required>
                                        <label for="lastName">Last Name</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-floating mb-3">
                                <select class="form-select" id="utilitySelect" required>
                                    <option value="" selected disabled>Select Electric Utility...</option>
                                    <option value="National Grid">National Grid</option>
                                    <option value="ConEdison">ConEdison</option>
                                    <option value="Eversource">Eversource</option>
                                    <option value="PSEG">PSEG</option>
                                    <option value="Other">Other Regional Utility</option>
                                </select>
                                <label for="utilitySelect">Electric Utility Provider</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com"
                                    required>
                                <label for="emailInput">Email address</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="passwordInput" placeholder="Password"
                                    required>
                                <label for="passwordInput">Password</label>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="terms" checked required>
                                <label class="form-check-label small text-muted" for="terms">
                                    I agree to the <a href="#" class="text-decoration-none">Subscriber Terms</a> and understand there is $0 upfront fee.
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold">Complete Subscription</button>
                        </form>
                        <div class="d-flex align-items-center my-3">
                            <hr class="flex-grow-1">
                            <span class="mx-2 text-muted small">OR</span>
                            <hr class="flex-grow-1">
                        </div>
                        <button class="btn btn-outline-secondary w-100 mb-2 fw-semibold btn-sm py-2">
                            <i class="bi bi-google me-2 text-danger"></i> Sign up with Google
                        </button>
                        <div class="text-center mt-4">
                            <p class="mb-0 small">Already a subscriber? <a href="login.html"
                                    class="fw-bold text-primary text-decoration-none">Subscriber Login</a></p>
                        </div>
                        <div class="text-center mt-3">
                            <a href="index.html" class="text-muted text-decoration-none small"><i
                                    class="bi bi-arrow-left"></i> Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
