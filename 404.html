<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Sunova</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">

<body class="d-flex align-items-center justify-content-center min-vh-100 text-center">

    <div class="position-fixed top-0 end-0 p-3 d-flex gap-2" style="z-index: 1050;">
        <button class="rtl-toggle" id="rtlToggle" title="Toggle RTL/LTR">

        </button>
        <button class="theme-toggle" id="themeToggle" title="Switch Theme">
            <i class="bi bi-moon-fill"></i>
        </button>
    </div>


    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <img src="assets/images/logo.svg" alt="Sunova" width="70" height="70" class="mb-3">
                <h1 class="display-1 fw-bold text-primary">404</h1>
                <h2 class="mb-4 fw-bold">Page Not Found</h2>
                <p class="lead text-muted mb-5">Oops! The solar farm page you are looking for seems to have gone off-grid. It might have been moved or updated.</p>
                <a href="index.html" class="btn btn-primary btn-lg"><i class="bi bi-house-door-fill me-2"></i>Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
